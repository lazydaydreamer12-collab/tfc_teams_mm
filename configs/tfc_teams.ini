// tfc_teams.ini - TFC Teams (auto-balance + !scramble vote)
//
// Lives in addons/tfc_teams_mm/configs/. Read at every map start; "tt_reload"
// in the server console re-reads it straight away. One "key value" per line;
// anything after // is a comment. Leave a line out and its default is used.

enabled                 1       // 0 turns the whole plugin off
debug                   1       // 1 = write addons/tfc_teams_mm/tt_trace.log (turn off once it's settled)

// ---------------------------------------------------------------- auto-balance
// Players are only ever moved while they are dead, and they keep their class.
balance_enabled         1
balance_threshold       2       // act when the biggest team has this many more players than the smallest
balance_delay           5       // ...and it has stayed that way this many seconds
balance_patience        30      // seconds to wait for a "preferred" player to die before taking anyone who dies
balance_new_window      180     // players who picked their team within this many seconds are "newest joiners" (moved first)
balance_candidates      3       // how many of the ranked players count as preferred
balance_immunity        120     // someone we moved is not moved again for this many seconds
balance_include_bots    1       // bots can be moved
balance_prefer_bots     1       // move bots before humans when the big team has any
balance_force_after     60      // nobody on the big team has died for this long: warn the best pick and move them alive (0 = never)
balance_force_warn      10      // seconds of warning before that forced move (dying in the meantime moves them anyway)
block_uneven_join       1       // refuse "join team" onto a team that is already balance_threshold ahead
admin_immunity          0       // 1 = admins are never auto-moved or join-blocked

// ---------------------------------------------------------------- scramble vote
// Say !scramble (or /scramble, or just scramble). !teams shows the counts and votes.
vote_enabled            1
vote_percent            40      // % of eligible players needed
vote_min_votes          1       // and never fewer than this many votes (raise it for a busy server)
vote_map_start_delay    180     // no voting in the first 3 minutes of a map
vote_cooldown           300     // no voting for 5 minutes after a scramble
vote_afk_time           60      // idle this many seconds = AFK: vote removed, not counted
vote_count_spectators   0       // 1 = spectators can vote and count toward the %
scramble_max_wait       90      // moves still waiting for a respawn after this many seconds are dropped
scramble_include_bots   1       // 0 = bots stay on their teams and the humans are dealt around them
scramble_mode           respawn // respawn = movers switch at their next death
                                // reset   = everyone goes to spectator, then all are placed on the
                                //           scrambled teams together (good for attack/defend maps)
scramble_reset_delay    3       // reset mode: seconds in spectator before everyone is placed (1.5 - 30)
scramble_reset_restore_frags 1  // reset mode: give everyone their frags back (TFC zeroes them in spectator)

// ---------------------------------------------------------------- player stats
// Tracked per SteamID (bots as BOT:<name>, kept out of rankings) in addons/tfc_teams_mm/tt_stats.txt.
// Chat: !stats [name] (window), !rank and !top10 (rankings window), !weapons [name] (console table).
// The rating is points per 10 minutes on a team, smoothed across maps; the spectator-reset
// scramble deals players by it.
stats_enabled             1
stats_points_kill         1     // rating points for a kill of an enemy
stats_points_carrier_kill 2     // extra points when the victim was carrying a flag/goal item
stats_points_cap          5     // capturing
stats_points_pickup       1     // picking up the enemy flag/goal item
stats_points_teamkill     -2    // killing a team-mate
stats_min_map_minutes     3     // on a team this long before a map counts toward the rating
stats_min_rank_minutes    10    // lifetime minutes before someone appears in !rank / !top10
stats_new_rating          0     // rating for someone never seen before (0 = the median of known players)
stats_window              1     // !stats and !top10: 1 = window (MOTD panel; !stats <class> for one class), 2 = paged menu (8 back, 9 next, 0 close), 0 = chat lines
stats_debug_caps          1     // CAPDBG lines in tt_trace.log for working out captures on each map (turn off when settled)
stats_cap_word            cap   // an item carried into a goal whose name contains this counts as a capture even with no score
stats_return_word         return // ...unless a goal activated with it contains this (returning your own flag)
stats_summary             2     // end of map: 2 = awards window + chat lines, 1 = chat lines only, 0 = off
stats_menu_time           60    // seconds the paged !stats / !top10 menu stays up (0 = until closed with 0)
stats_save_interval       300   // seconds between saves (it also saves at every map end)

// ---------------------------------------------------------------- chat tips
advert_interval         300     // seconds between tips in chat on !scramble / !teams / !stats (0 = off)
advert_first            270     // the first tip this many seconds into a map (the RTV plugin's come at 120, so they take turns)
advert_join             40      // tell each player the commands this long after they join (once per server session; 0 = off)
// advert               "Your own tip here"   // up to 8 lines (under ~170 characters each); they replace the built-in tips

// ---------------------------------------------------------------- admins
// Admins can use !forcescramble [now|reset|respawn] and !cancelscramble in chat.
// The server console / rcon always can: tt_scramble [now|reset|respawn], tt_cancel, tt_status,
// tt_move <name|#userid> <team>, tt_reload.
amxx_users              1       // also take admins from amxmodx/configs/users.ini (SteamID entries)...
amxx_flag               j       // ...that have this access flag (j = AMXX's vote flag)
// admin                STEAM_0:1:12345

// ---------------------------------------------------------------- per-map settings
// Settings for particular maps go in a [map] section, at the END of this file:
// the lines under it apply only on that map, on top of everything above.
//   [dustbowl]              one map
//   [dustbowl avanti cz2]   several (commas are fine too)
//   [cz*]                   * matches anything
//   [all]                   back to lines for every map
// Or put them in configs/maps/<map>.ini (same "key value" lines), read after this file.
// Any setting can go in a section; !teams shows the scramble mode on the current map.

[2fort]
scramble_mode           respawn

[dustbowl]
scramble_mode           reset
